version: '3.9'
services:
  backend:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install uv && uv sync && uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
